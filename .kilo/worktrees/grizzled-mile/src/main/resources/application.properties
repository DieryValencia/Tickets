spring.application.name=tickets-plataforma-app

# Puerto HTTP de la aplicacion
server.port=8082

# Lee el archivo .env de la raiz del proyecto como si fueran properties,
# para tener POSTGRES_PASSWORD y JWT_SECRET disponibles sin definirlos a mano
# en cada terminal. "optional:" evita fallar si el archivo no existe (por
# ejemplo dentro de Docker, donde llegan por variable de entorno).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5434/tickets_eventos_db
spring.datasource.username=tickets_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# El mapeo a DTO ocurre en la capa service, asi que no hace falta
# mantener la sesion abierta durante el render de la vista.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Firmado del JWT con HS512. La clave viene del entorno y debe medir al menos
# 64 bytes; si falta, la aplicacion falla al arrancar (ver JwtService).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:120}

# El perfil "dev" es el unico que activa el sembrado de datos (DataSeeder).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.url=jdbc:h2:mem:tickets_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never

# El perfil se activa con @ActiveProfiles("test") en las pruebas, no con
# spring.profiles.active: Spring no admite esa clave dentro de un archivo
# especifico de perfil.

# Clave de pruebas. Solo sirve para firmar tokens dentro de la suite,
# nunca sale de ella.
app.security.jwt.secret=clave_de_pruebas_solo_para_la_suite_de_taller_tickets_no_usar_en_produccion_0123456789
app.security.jwt.access-token-minutes=60

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN
logging.level.com.tickets.Tickets=INFO